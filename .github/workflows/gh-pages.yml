name: Deploy forest

# Build the forest in CI and publish to GitHub Pages. The build runs inside the
# forester-ci image (forester binary + LaTeX toolchain + Node/pnpm), so nothing
# native is installed on the runner and `output/` is never committed to git.
#
# The image tag is the single point of truth for the forester version — bump it
# here (and cut a matching release in KaiErikNiermann/forester) to upgrade.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kaierikniermann/forester-ci:v0.1.0
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir theme/dev install --frozen-lockfile

      # Lean is absent in the image, so the verso stage reuses the committed
      # build/verso fragments (see scripts/build_verso.py). forester compiles
      # math/diagrams via the image's latex + dvisvgm.
      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/notes

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

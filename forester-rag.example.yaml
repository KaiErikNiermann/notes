# yaml-language-server: $schema=./src/forester_rag/config_schema.json
# Example forester-rag configuration file
# Copy to .forester-rag.yaml in your project root

# Path to the SQLite index database
index_path: .rag/index.sqlite

# Source mode: auto, tree, or xml
source: auto

# Chunking settings
chunk_tokens: 400
chunk_overlap: 80

# Retrieval mode: hybrid, embeddings, or bm25
retrieval: hybrid

# Model configuration
embedding_model: text-embedding-3-small
chat_model: gpt-4o-mini

# Hybrid retrieval weights (should sum to 1.0)
embedding_weight: 0.7
bm25_weight: 0.3

# OpenAI configuration (optional - prefers OPENAI_API_KEY env var)
# Never commit real API keys to git.
# openai:
#   api_key: sk-...
#   base_url: https://api.openai.com/v1

# Generation defaults
generation_model: gpt-4o-mini
planning_model: gpt-4o-mini
verification_model: gpt-4o-mini
# Dedicated model for code problem generation
code_model: gpt-5-mini
generation_temperature: 0.2
verification_temperature: 0.0
source_base_url: null
code_system_prompts:
  - Use strict typing and explicit type annotations where possible.
  - Follow modern language conventions and idiomatic patterns.
  - Write robust solutions that cover edge cases without unnecessary complexity.
generation_counts:
  flashcards: 3
  rubrics: 1
  code: 1
language_runner_map:
  python: python-default
  cpp: cpp-default
  rust: rust-default
  typescript: typescript-default
  ocaml: ocaml-default
  haskell: haskell-default
generation_output_dir: problems

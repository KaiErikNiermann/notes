[tool.poetry]
name = "forester-rag"
version = "0.1.0"
description = "Forester RAG CLI"
authors = ["Forester RAG <dev@local>"]
readme = "README.md"
packages = [{ include = "forester_rag", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.21.0"
openai = "^1.55.0"
defusedxml = "^0.7.1"
rank-bm25 = "^0.2.2"
numpy = "^2.1.3"
tiktoken = "^0.12.0"
pyyaml = "^6.0.2"
pydantic = "^2.10.0"
haystack-ai = "^2.10.3"
pypdf = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ruff = "^0.8.2"
black = "^24.10.0"

[tool.poetry.scripts]
forester-rag = "forester_rag.cli:app"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "UP", "SIM"]
# B008 conflicts with typer usage, which is intentional

[tool.forester_rag]
index_path = ".rag/index.sqlite"
source = "auto"
chunk_tokens = 400
chunk_overlap = 80
retrieval = "hybrid"
embedding_model = "text-embedding-3-small"
chat_model = "gpt-4o-mini"
embedding_weight = 0.7
bm25_weight = 0.3

[tool.pytest.ini_options]
pythonpath = ["src"]

<!DOCTYPE html>
<html lang="en" data-base-url="/notes/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Graph</title>
  <link rel="icon" type="image/svg+xml" href="/notes/notes-icon.svg">
  <link rel="stylesheet" href="/notes/style.css">
  <link rel="stylesheet" href="graph.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body[data-theme] { background: var(--bg-color); }
    #graph-root { width: 100%; height: calc(100vh - 0px); position: relative; }
    /* Subtle home button so users can get back to /notes/ from the graph page. */
    .fgv-home-link {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 100;
      color: var(--text-color);
      text-decoration: none;
      opacity: 0.7;
      font-family: var(--code-font-stack, ui-monospace, monospace);
      font-size: 13px;
    }
    .fgv-home-link:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body data-theme="dark">
  <a class="fgv-home-link" href="/notes/index/">« notes</a>
  <main id="graph-root"></main>
  <!-- Renderer bundle (IIFE; exposes window.ForesterGraphView). -->
  <script src="graph.js"></script>
  <!-- Notes-site theme + mount wiring. -->
  <script type="module" src="notes-theme-mount.js"></script>
</body>
</html>
